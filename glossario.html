<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Glossario · Educazione cinofila</title>
<style>
:root { --orange: #ef6b0b; --orange-dark: #c94d12; --navy: #1d2d50; --muted: #89919b; --line: #e8e8e5; --bg: #fff; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--navy); font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
body.modal-open { overflow: hidden; } /* Blocca lo sfondo quando la card è aperta */
button { font: inherit; }

.app { max-width: 620px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; padding: 22px 18px calc(65px + env(safe-area-inset-bottom)); }
header { text-align: center; padding: 5px 0 10px; flex-shrink: 0; }
h1 { margin: 0; color: var(--orange); font-size: 30px; line-height: 1.1; font-weight: 850; letter-spacing: -.8px; }

/* Barra lettere scorrevole fluida */
.letter-window { 
  overflow-x: auto; 
  scroll-behavior: smooth; 
  scrollbar-width: none;
  padding: 10px 0 15px 0;
  margin: 0 -18px;
  flex-shrink: 0;
}
.letter-window::-webkit-scrollbar { display: none; }
.letters { 
  display: flex; 
  align-items: center; 
  gap: 10px; 
  width: max-content; 
  padding: 0 18px;
}

.letter { flex: 0 0 42px; height: 43px; border: 0; border-radius: 12px; background: #f2f3f4; color: #89919b; font-weight: 800; font-size: 17px; cursor: pointer; transition: all .2s ease; display:flex; justify-content:center; align-items:center; }
.letter.active { background: var(--orange); color: #fff; transform: scale(1.15); box-shadow: 0 5px 13px #ef6b0b40; }

/* Rettangoli grigi vuoti (placeholder) */
.letter.empty { background: #f2f3f4; pointer-events: none; opacity: 0.5; }

/* Lista verticale completa */
.list { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 20px; scrollbar-width: thin; scroll-behavior: smooth; }
.letter-section { margin-bottom: 25px; }

/* Intestazione sezione lettera (Centrata, senza riga sopra) */
.section-head { display: flex; justify-content: center; align-items: center; padding: 15px 2px 10px; position: sticky; top: 0; background: var(--bg); z-index: 10; }
.section-head strong { font-size: 22px; color: var(--orange); line-height: 1; }

/* Voci centrate (con riga sotto) */
.item { width: 100%; background: #fff; border: 0; border-bottom: 1px solid var(--line); padding: 15px 3px; display: flex; justify-content: center; align-items: center; text-align: center; color: var(--navy); font-weight: 680; font-size: 15px; cursor: pointer; }
.item:active { background: #fff7f1; }

/* Barra di Navigazione Bassa Orizzontale */
.bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding-bottom: env(safe-area-inset-bottom); z-index: 9000; box-shadow: 0 -4px 15px rgba(29, 45, 80, 0.05); height: 56px; }
.nav-item { flex: 1; color: var(--muted); text-decoration: none; font-size: 15px; font-weight: 750; display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 8px; -webkit-tap-highlight-color: transparent; }
.nav-item.active { color: var(--orange); }
.nav-icon { font-size: 20px; line-height: 1; filter: grayscale(100%) opacity(0.6); transition: all 0.2s; }
.nav-item.active .nav-icon { filter: grayscale(0%) opacity(1); transform: scale(1.1); }

/* Overlay Card */
#detail { position: fixed; inset: 0; background: rgba(29, 45, 80, 0.65); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 9999; display: flex; flex-direction: column; justify-content: center; padding: 20px; overflow-y: auto; opacity: 1; transition: opacity 0.2s ease; }
#detail.hidden { opacity: 0; pointer-events: none; }

.card-wrapper { max-width: 500px; width: 100%; margin: auto; }
.card-stack { position: relative; padding: 0 8px 11px 0; }
.card-stack:before, .card-stack:after { content: ""; position: absolute; inset: 9px 0 0 9px; background: var(--orange-dark); border-radius: 25px; z-index: 0; box-shadow: 0 9px 20px #1d2d5018; }
.card-stack:after { inset: 5px 4px 5px 4px; background: #e45d0b; z-index: 1; }
.card { position: relative; z-index: 2; background: #fff; border: 1px solid #f0eee9; border-radius: 25px; padding: 22px 20px 20px; min-height: 340px; box-shadow: 0 14px 32px #1d2d5030; }

.card-kicker { color: var(--orange); font-size: 10px; font-weight: 850; letter-spacing: 1.3px; }
.card h2 { font-size: 27px; line-height: 1.12; letter-spacing: -.6px; margin: 13px 0 17px; color: var(--navy); }
.rule { height: 4px; width: 44px; border-radius: 4px; background: var(--orange); margin-bottom: 19px; }
.def-label { font-size: 10px; letter-spacing: 1.2px; color: var(--muted); font-weight: 850; margin-bottom: 8px; }
.definition { font-size: 16px; line-height: 1.55; margin: 0; color: var(--navy); }
.more { display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; color: var(--orange); font-weight: 850; padding: 18px 0 4px; cursor: pointer; }
.more-detail { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 15px; font-size: 14px; line-height: 1.55; }
.more-detail h3 { font-size: 16px; margin: 0 0 8px; }
.more-detail p { margin: 0 0 12px; }
.back-bottom { width: 100%; border: 1px solid #e8e8e8; border-radius: 14px; background: #fff; color: var(--navy); font-weight: 800; padding: 15px; box-shadow: 0 5px 15px #1d2d5010; margin-top: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; }
.hidden { display: none !important; }

@media(min-width: 600px) { .app { padding-top: 32px; } .card { min-height: 390px; padding: 30px; } .card h2 { font-size: 32px; } }
</style>
</head>
<body>
<main class="app" id="index">
  <header>
    <h1>Glossario</h1>
  </header>
  
  <div class="letter-window" id="letterWindow">
    <div class="letters" id="letters"></div>
  </div>
  
  <div class="list" id="list"></div>
</main>

<!-- Barra di navigazione bassa -->
<nav class="bottom-nav">
  <a href="glossario.html" class="nav-item active">
    <span class="nav-icon">📖</span> Glossario
  </a>
  <a href="quiz.html" class="nav-item">
    <span class="nav-icon">🃏</span> Quiz
  </a>
</nav>

<section id="detail" class="hidden">
  <div class="card-wrapper">
    <div class="card-stack">
      <article class="card">
        <div class="card-kicker">GLOSSARIO · EDUCAZIONE CINOFILA</div>
        <h2 id="termTitle"></h2><div class="rule"></div>
        <div class="def-label">DEFINIZIONE</div>
        <div id="definition" class="definition"></div>
        <button class="more hidden" id="more">Di più <span id="moreIcon">⌄</span></button>
        <div id="expanded" class="more-detail hidden"></div>
      </article>
    </div>
    <button class="back-bottom" id="backBottom"><span style="font-size: 18px;">✕</span> CHIUDI CARD</button>
  </div>
</section>

<script>
const terms = ["Ancoraggio","ATP (Aggressività Territoriale e Protettiva)","Base sicura","Centripetazione","CLASS","CONNECT","Deprivazione sensoriale","distress","EAM","Educazione mentale","Empatia: sentirsi sentiti","Esperienza di apprendimento mediato","Etogramma","Eustress","Fading","Finito","Flessibilità cognitiva","HBG (Human body Gym)","Honor Code","In Take Session","Indice motivazionale","Legge della Varietà indispensabile","Legge dell’effetto di Thorndike","Legame di attaccamento","Livelli cognitivi","Mindfulness: presenza mentale","Modellamento","Piano di sviluppo prossimale","Piano di sviluppo potenziale","Prossemica","Puppy Class","RDI (registro dialogico interattivo)","SCORE","Set neurale","Spirale dei bisogni","Splitting","Start line","Strange Situation","Stato di flusso","TOTE (Test Operate Test Exit)","Ttouch","Zoofarmacognosi","ZSP"];

terms.sort((a, b) => a.localeCompare(b, 'it', { sensitivity: 'base' }));
const grouped = {};
terms.forEach(t => {
  const l = t.charAt(0).toUpperCase();
  if(!grouped[l]) grouped[l] = [];
  grouped[l].push(t);
});
const availableLetters = Object.keys(grouped).sort();

const lettersEl = document.getElementById("letters");
const listEl = document.getElementById("list");
const letterWindow = document.getElementById("letterWindow");
let activeLetter = null;
let isProgrammaticScroll = false;

function initUI() {
  for(let i=0; i<8; i++) {
    const d = document.createElement("div");
    d.className = "letter empty";
    lettersEl.appendChild(d);
  }

  availableLetters.forEach(l => {
    const btn = document.createElement("button");
    btn.className = "letter";
    btn.id = "btn-" + l;
    btn.textContent = l;
    btn.addEventListener("click", () => scrollToSection(l));
    lettersEl.appendChild(btn);

    const sec = document.createElement("div");
    sec.className = "letter-section";
    sec.id = "sec-" + l;
    sec.setAttribute("data-letter", l);
    
    sec.innerHTML = `<div class="section-head"><strong>${l}</strong></div>`;
    
    grouped[l].forEach(t => {
      const itemBtn = document.createElement("button");
      itemBtn.className = "item";
      itemBtn.innerHTML = `<span>${t}</span>`;
      itemBtn.addEventListener("click", () => openCard(t));
      sec.appendChild(itemBtn);
    });
    listEl.appendChild(sec);
  });

  for(let i=0; i<8; i++) {
    const d = document.createElement("div");
    d.className = "letter empty";
    lettersEl.appendChild(d);
  }
}

function setActiveLetter(l) {
  if (activeLetter === l || !l) return;
  if (activeLetter) {
    const oldBtn = document.getElementById("btn-" + activeLetter);
    if (oldBtn) oldBtn.classList.remove("active");
  }
  activeLetter = l;
  const newBtn = document.getElementById("btn-" + l);
  if (newBtn) {
    newBtn.classList.add("active");
    const shift = newBtn.offsetLeft + (newBtn.offsetWidth / 2) - (letterWindow.clientWidth / 2);
    letterWindow.scrollTo({ left: shift, behavior: 'smooth' });
  }
}

function scrollToSection(l) {
  isProgrammaticScroll = true;
  setActiveLetter(l);
  const section = document.getElementById("sec-" + l);
  if (section) {
    listEl.scrollTo({ top: section.offsetTop - listEl.offsetTop, behavior: 'smooth' });
  }
  setTimeout(() => { isProgrammaticScroll = false; }, 800);
}

const observer = new IntersectionObserver(entries => {
  if (isProgrammaticScroll) return;
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const l = entry.target.getAttribute("data-letter");
      setActiveLetter(l);
    }
  });
}, { root: listEl, rootMargin: "-10px 0px -80% 0px" });

// 1. Dizionario delle Definizioni (Testo principale)
const dictionary = {
  "Educazione mentale": "L’educazione mentale è un processo educativo che mira a produrre evoluzioni interne nel cane, aumentando consapevolezza, competenze e capacità di ragionare sulle situazioni.",
  "Livelli cognitivi": "Sono uno strumento che abbiamo a disposizione per analizzare in profondità cosa sta succedendo nel cane, attraverso l'osservazione di ambiente, comportamento, capacità, motivazioni, bisogni. Lavorando sui livelli interni (emozioni, capacità, motivazioni e bisogni) si arriva ad influenzare e poter lavorare sui livelli esterni (ambiente e comportamento)."
};

// 2. Dizionario degli Approfondimenti (Sezione "Di più")
const detailsDictionary = {
  "Educazione mentale": `<h3>Guardare oltre il comportamento</h3>
  <p>Per comprendere davvero il cane non basta osservare ciò che fa. Occorre andare oltre il comportamento visibile e interrogarsi su ciò che lo genera.</p>
  <p><b>BACKGROUND</b><br>Comprende la storia del cane e i suoi bisogni: le esperienze che ha vissuto e ciò di cui necessita.</p>
  <p><b>DOTAZIONI</b><br>Comprendono le sue capacità e le sue emozioni, cioè le risorse interne con cui affronta le diverse situazioni.</p>
  <p><b>DA DENTRO VERSO FUORI</b><br>L'obiettivo non è semplicemente modificare un comportamento esterno, ma favorire un cambiamento interno.</p>`,
  
  "Livelli cognitivi": `<p>I Livelli Logici (o Neurologici) sono un modello elaborato dallo psicologo Robert Dilts sulla base degli studi intrapresi da Gregory Bateson sulla cognizione e l’apprendimento. L’intento di Dilts era quello di semplificare il modo in cui la mente è organizzata, in funzione di interventi di psicoterapia e coaching.</p>
  <p>Ogni livello corrisponde a una determinata neurologia:</p>
  <ul style="padding-left: 20px;">
    <li style="margin-bottom: 6px;"><b>Ambiente</b> - percezione - organi di senso - sistema nervoso periferico</li>
    <li style="margin-bottom: 6px;"><b>Comportamento</b> - apparato muscolo scheletrico - cervelletto - sistema nervoso piramidale</li>
    <li style="margin-bottom: 6px;"><b>Capacità</b> - neocorteccia</li>
    <li style="margin-bottom: 6px;"><b>Motivazioni</b> - sistema limbico</li>
    <li style="margin-bottom: 6px;"><b>Identità</b> - sistema endocrino, linfatico e immunitario</li>
    <li style="margin-bottom: 6px;"><b>Relazioni</b> - neuroni specchio, mente collettiva, "campo"</li>
  </ul>`
  <h3> Analisi degli aspetti interni </h3>
<h4>LO STATO EMOTIVO </h3>
<p>Come sta il cane in quel momento? Lo stato emotivo influenza le scelte che il cane è in grado di prendere e condiziona la sua capacità di apprendere. Un cane in difficoltà emotiva non è disponibile all'apprendimento</p>
 <ul style="padding-left: 20px;">
  <li style="margin-bottom: 6px;">tranquillo</li>
  <li style="margin-bottom: 6px;">attivato</li>
  <li style="margin-bottom: 6px;">insicuro</li>
  <li style="margin-bottom: 6px;">frustrato</li>
  <li style="margin-bottom: 6px;">bloccato (freeze)</li> </ul>

<h4>LE MOTIVAZIONI</h3>
<p>le spinte che guidano il comportamento. Ad esempio:</p>
 <ul style="padding-left: 20px;">
  <li style="margin-bottom: 6px;">Esplorativa -> tira al guinzaglio, annusa intensamente = SI MUOVE NELL'AMBIENTE</li>
  <li style="margin-bottom: 6px;">tira verso altri cani, salta addosso = CERCA CONTATTO</li>
  <li style="margin-bottom: 6px;">fissare, inseguire, scatta alla vista di uccello = SI ATTIVA AL MOVIMENTO</li>
</ul>

<h4>I BISOGNI SODDISFATTI E NON</h3>
<p>Ad esempio:</p>
 <ul style="padding-left: 20px;">
  <li style="margin-bottom: 6px;">bisogno di movimento non soddisfatto -> iperattività</li>
  <li style="margin-bottom: 6px;">bisogno di sicurezza non soddisfatto -> evitamento / freeze</li>
  <li style="margin-bottom: 6px;">bisogno relazionale non soddisfatto -> iper-attaccamento o richiesta continua</li>
</ul>
};

let currentTerm = null; // Memorizza la parola attualmente aperta

function openCard(t) {
  currentTerm = t; // Salva la voce aperta
  document.body.classList.add("modal-open");
  document.getElementById("detail").classList.remove("hidden");
  document.getElementById("termTitle").textContent = t;
  
  // Imposta la definizione (se esiste, sennò fallback)
  const hasDefinition = dictionary.hasOwnProperty(t);
  document.getElementById("definition").textContent = hasDefinition ? dictionary[t] : "Definizione in preparazione.";
  
  // Mostra o nascondi il pulsante "Di più" se c'è un approfondimento
  const hasMoreDetails = detailsDictionary.hasOwnProperty(t);
  const moreBtn = document.getElementById("more");
  moreBtn.classList.toggle("hidden", !hasMoreDetails);
  
  // Resetta lo stato di espansione ogni volta che apri una nuova card
  expanded = false;
  document.getElementById("expanded").classList.add("hidden");
  document.getElementById("moreIcon").textContent = "⌄";
}

function closeCard() {
  document.getElementById("detail").classList.add("hidden");
  document.body.classList.remove("modal-open");
}

document.getElementById("backBottom").onclick = closeCard;
document.getElementById("detail").addEventListener('click', function(e) {
  if (e.target === this) closeCard();
});

let expanded = false;
document.getElementById("more").onclick = () => {
  expanded = !expanded;
  const el = document.getElementById("expanded");
  el.classList.toggle("hidden", !expanded);
  document.getElementById("moreIcon").textContent = expanded ? "⌃" : "⌄";
  
  // Stampa l'approfondimento corretto in base alla parola selezionata
  el.innerHTML = (expanded && detailsDictionary[currentTerm]) ? detailsDictionary[currentTerm] : "";
};

initUI();
document.querySelectorAll(".letter-section").forEach(sec => observer.observe(sec));
setTimeout(() => setActiveLetter(availableLetters[0]), 100);
</script>
</body>
</html>
