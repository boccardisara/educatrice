<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Esame nun te temo</title>
<style>
:root { --orange: #ef6b0b; --orange-dark: #c94d12; --navy: #1d2d50; --muted: #89919b; --line: #e8e8e5; --bg: #fff; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--navy); font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; min-height: 100dvh; }

/* Contenitore principale che centra tutto verticalmente */
.app { max-width: 620px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px 24px calc(24px + env(safe-area-inset-bottom)); }

.header-text { text-align: center; margin-bottom: 45px; }
h1 { margin: 0 0 10px; color: var(--orange); font-size: 32px; line-height: 1.1; font-weight: 850; letter-spacing: -.8px; }
.subtitle { margin: 0; color: var(--muted); font-size: 16px; font-weight: 500; font-style: italic; }

/* Gruppo Pulsanti */
.btn-group { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 16px; }

.btn { 
  width: 100%; padding: 18px 20px; border-radius: 16px; font-size: 18px; font-weight: 800; cursor: pointer; text-decoration: none; display: flex; justify-content: center; align-items: center; gap: 10px; transition: transform 0.2s, box-shadow 0.2s; border: none;
}
.btn:active { transform: scale(0.97); }

/* Pulsanti specifici */
.btn-quiz { background: var(--orange); color: #fff; box-shadow: 0 8px 20px #ef6b0b40; }
.btn-quiz:active { background: var(--orange-dark); box-shadow: 0 4px 10px #ef6b0b40; }

.btn-glossario { background: #fff; color: var(--navy); border: 2px solid var(--line); box-shadow: 0 4px 15px #1d2d5008; }
.btn-glossario:active { background: #f9f9f9; border-color: #dcdcdc; }

.icon { font-size: 22px; line-height: 1; }
</style>
</head>
<body>
<main class="app">
  
  <div class="header-text">
    <h1>Esame nun te temo</h1>
    <p class="subtitle">"senza fretta ma senza sosta"</p>
  </div>
  
  <div class="btn-group">
    <!-- Collegamento alla pagina del Glossario -->
    <a href="glossario.html" class="btn btn-glossario">
      <span class="icon">📖</span> Glossario
    </a>
    <!-- Collegamento alla pagina del Quiz -->
    <a href="quiz.html" class="btn btn-quiz">
      <span class="icon">🃏</span> Quiz
    </a>
  </div>

</main>
</body>
</html>
